<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChatLab</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Toggle conversation history">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <h1>ChatLab</h1>
      <button id="highlights-toggle" class="highlights-toggle" type="button">
        Highlights <span id="highlight-count" class="highlight-count">0</span>
      </button>
    </header>

    <div class="app-body">
      <aside id="sidebar" class="sidebar">
        <button id="new-chat-btn" class="new-chat-button" type="button">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="16" height="16">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          New Chat
        </button>
        <div class="new-project-form">
          <input id="new-project-input" class="new-project-input" type="text" placeholder="New project name" />
          <button id="new-project-btn" class="new-project-button" type="button">+ Add</button>
        </div>
        <div id="conversation-list" class="conversation-list"></div>
      </aside>

      <div class="main-column">
        <main id="chat-log" class="chat-log"></main>

        <footer class="composer">
          <form id="chat-form" class="composer-form">
            <textarea
              id="question"
              class="composer-input"
              placeholder="Message the chatbot..."
              rows="1"
              required
            ></textarea>
            <button type="submit" class="send-button" aria-label="Send message">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>
          <p class="composer-hint">Enter for a new line &middot; Shift+Enter to send</p>
        </footer>
      </div>

      <aside id="highlights-panel" class="highlights-panel">
        <div class="highlights-panel-header">
          <h2>Highlights</h2>
          <button id="highlights-close" class="highlights-close" type="button" aria-label="Close highlights panel">&times;</button>
        </div>

        <div id="highlights-list" class="highlights-list"></div>

        <div class="highlights-actions">
          <button id="generate-note-btn" type="button" class="generate-note-button">Generate Note from Highlights</button>
          <textarea id="generated-note" class="generated-note" readonly hidden></textarea>
        </div>
      </aside>
    </div>

    <button id="selection-popup" class="selection-popup" type="button" hidden>+ Highlight</button>

    <div id="btw-backdrop" class="btw-backdrop" hidden></div>

    <div id="btw-panel" class="btw-panel" hidden role="dialog" aria-modal="true" aria-label="BTW side conversation">
      <div class="btw-panel-header">
        <span class="btw-panel-title">BTW</span>
        <button id="btw-close" class="btw-close" type="button" aria-label="Close BTW panel">&times;</button>
      </div>

      <div id="btw-turns" class="btw-turns"></div>

      <form id="btw-form" class="btw-input-row">
        <textarea id="btw-input" class="btw-input" rows="2" placeholder="Ask about this response... (Shift+Enter to send)"></textarea>
        <button type="submit" class="btw-send-button">Send</button>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
