<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simple Chatbot</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Simple Chatbot</h1>
      <button id="highlights-toggle" class="highlights-toggle" type="button">
        Highlights <span id="highlight-count" class="highlight-count">0</span>
      </button>
    </header>

    <div class="app-body">
      <div class="main-column">
        <main id="chat-log" class="chat-log"></main>

        <footer class="composer">
          <form id="chat-form" class="composer-form">
            <textarea
              id="question"
              class="composer-input"
              placeholder="Message the chatbot..."
              rows="1"
              required
            ></textarea>
            <button type="submit" class="send-button" aria-label="Send message">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>
          <p class="composer-hint">Enter for a new line &middot; Shift+Enter to send</p>
        </footer>
      </div>

      <aside id="highlights-panel" class="highlights-panel">
        <div class="highlights-panel-header">
          <h2>Highlights</h2>
          <button id="highlights-close" class="highlights-close" type="button" aria-label="Close highlights panel">&times;</button>
        </div>

        <div id="highlights-list" class="highlights-list"></div>

        <div class="highlights-actions">
          <button id="generate-note-btn" type="button" class="generate-note-button">Generate Note from Highlights</button>
          <textarea id="generated-note" class="generated-note" readonly hidden></textarea>
        </div>
      </aside>
    </div>

    <button id="selection-popup" class="selection-popup" type="button" hidden>+ Highlight</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
